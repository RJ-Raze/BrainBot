services:
  postgres:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging: &bounded_logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collab_platform}
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env.deploy 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging: *bounded_logging
    build:
      context: ./server
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_platform}
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env.deploy 中设置 POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请先在 .env.deploy 中设置 JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      LLM_MOCK: ${LLM_MOCK:-false}
      ALLOW_MOCK_PRODUCTION: ${ALLOW_MOCK_PRODUCTION:-false}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
    volumes:
      - uploads_data:/app/uploads
    command: node scripts/start.js
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *bounded_logging
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
