services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ./ops/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
